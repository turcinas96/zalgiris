<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zalgiris Score Predictions</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1 id="team-heading">Zalgiris Score Predictions</h1>
    <p class="subtitle" id="season-label"></p>
    <div class="scoreboard">
      <div class="scoreboard-entry">
        <p class="predictor-name" id="name-a"></p>
        <p class="predictor-points" id="points-a"></p>
      </div>
      <div class="scoreboard-entry">
        <p class="predictor-name" id="name-b"></p>
        <p class="predictor-points" id="points-b"></p>
      </div>
    </div>
    <p class="legend">
      <span class="badge badge-exact">●</span> Exact score (3 pts)
      <span class="badge badge-winner">●</span> Correct winner (1 pt)
      <span class="badge badge-wrong">●</span> Incorrect
    </p>
  </header>

  <main>
    <table id="games-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Opponent</th>
          <th>H/A</th>
          <th id="header-a"></th>
          <th>Actual</th>
          <th id="header-b"></th>
        </tr>
      </thead>
      <tbody id="games-rows"></tbody>
    </table>
  </main>

  <footer class="page-footer">
    <p>Edit <code>data.js</code> to add games and update predictions.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
